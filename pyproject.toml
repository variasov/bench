[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "bench"
version = "0.1"
authors = [
    {name = "Sergei Variasov", email = "variasov@gmail.com"},
]
description = "bench for db rows parsing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "psycopg~=3.3",
    "psycopg_pool~=3.3",
    "msgspec",
    "pydantic",
    "classic-db-tools",
    "sqlalchemy"
]

[project.urls]
Homepage = "https://github.com/variasov/db-parsing-benchmarks"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest~=9.0",
]
